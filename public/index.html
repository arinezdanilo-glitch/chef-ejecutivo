<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chef Ejecutivo - Menú</title>
<style>
:root{--crema:#fbf6ef;--beige:#efe2d0;--marron:#4a2c1d;--marron2:#6b4226;--dorado:#c8923a}
[hidden]{display:none!important}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--crema);color:var(--marron)}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:14px 24px;background:#fff}
.logo{font:italic bold 1.8rem Georgia,serif;line-height:1}.logo small{display:block;font:italic .75rem Georgia,serif;color:var(--dorado);margin-top:4px}
nav{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:0;border-radius:22px;padding:8px 20px;font:600 .95rem "Segoe UI",sans-serif;cursor:pointer;background:var(--beige);color:var(--marron)}
.tab.on{background:var(--marron);color:#fff}
.hero{background:linear-gradient(120deg,var(--beige),#f6ebdc);padding:40px 24px;border-bottom:1px solid var(--beige)}
.hero h1{margin:0;font:bold 2.4rem Georgia,serif}.hero p{margin:6px 0 0;font-size:1.1rem}.hero hr{width:60px;border:0;border-top:3px solid var(--dorado);margin:14px 0 0;text-align:left}
main{max-width:1100px;margin:auto;padding:24px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(74,44,29,.12);overflow:hidden;display:flex;flex-direction:column}
.foto{background:var(--beige);display:flex;align-items:center;justify-content:center;font-size:2.6rem}
.foto.vacia{height:150px}
.foto img{display:block;width:100%;height:auto}
.cuerpo{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cuerpo h3{margin:0;font-size:1.05rem}.cuerpo p{margin:0;font-size:.88rem;color:#6f5a4c;flex:1}
.fila{display:flex;justify-content:space-between;align-items:center}.precio{font-weight:700;font-size:1.15rem}
.badge{background:var(--marron);color:#fff;font-size:.7rem;border-radius:10px;padding:3px 8px}
.agotado .foto,.agotado h3{opacity:.55}
.dest{display:flex;flex-direction:column;gap:18px;margin-bottom:28px}
.banner{background:var(--marron);color:#fff;border-radius:24px;display:flex;align-items:center;gap:28px;padding:24px 28px}
.banner .img{width:260px;flex-shrink:0;border-radius:16px;overflow:hidden;background:var(--beige);display:flex;align-items:center;justify-content:center;font-size:3rem}
.banner .img.vacia{height:140px}.banner .img img{display:block;width:100%;height:auto}.banner .txt{flex:1}
.etq{color:#e8c98f;font-weight:700;letter-spacing:2px;font-size:.8rem}.banner h2{margin:6px 0;font:bold 1.9rem Georgia,serif}
.banner p{margin:0 0 14px;color:#f0e4d2;line-height:1.5}.pie2{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.pr2{font:bold 1.6rem Georgia,serif}
.banner button{background:var(--dorado);color:#2b1a10;border:0;border-radius:20px;padding:9px 18px;font-weight:600;cursor:pointer}
footer{background:var(--marron);color:#f6ebdc;text-align:center;padding:18px;font:italic 1.2rem Georgia,serif;margin-top:32px}
@media(max-width:640px){.grid{grid-template-columns:1fr}.card{flex-direction:row}.foto{width:120px;flex-shrink:0;align-self:flex-start}.foto.vacia{height:120px}.hero h1{font-size:1.8rem}.banner{flex-direction:column;align-items:stretch}.banner .img{width:100%}}
</style></head><body>
<header>
 <div class="logo">Chef Ejecutivo<small>Comida que se disfruta</small></div>
 <nav id="tabs"></nav>
</header>
<section class="hero"><h1>Nuestro Menú</h1><p>Sabores únicos en cada plato</p><hr></section>
<main><div id="destacados"></div><div class="grid" id="grid"></div></main>
<footer>¡Buen provecho!</footer>
<script>
// Página del CLIENTE: solo lee el menú. No tiene formularios ni botones de edición.
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let cats = [], platos = [], tab = null;

async function cargar() {
  try {
    const [c, p] = await Promise.all([fetch('/api/categorias'), fetch('/api/platos')]);
    cats = await c.json(); platos = await p.json();
    if (!tab && cats.length) tab = cats[0]._id;
    dibujar();
  } catch (e) { $('grid').innerHTML = '<p>No se pudo cargar el menú. Intenta de nuevo en unos segundos.</p>'; }
}

function dibujar() {
  $('tabs').innerHTML = cats.map(c => `<button class="tab ${c._id === tab ? 'on' : ''}" onclick="tab='${c._id}';dibujar()">${esc(c.nombre)}</button>`).join('');
  // Platos destacados (los marca el administrador, máximo 3): se muestran como banners
  const dest = platos.filter(p => p.destacado && p.disponible).slice(0, 3);
  $('destacados').innerHTML = dest.length ? '<div class="dest">' + dest.map(p => `
   <article class="banner">
    <div class="img ${p.imagen ? '' : 'vacia'}">${p.imagen ? `<img src="${esc(p.imagen)}" alt="" onerror="this.parentNode.classList.add('vacia');this.replaceWith('🍽')">` : '🍽'}</div>
    <div class="txt"><div class="etq">PLATO DESTACADO</div><h2>${esc(p.nombre)}</h2><p>${esc(p.descripcion)}</p>
     <div class="pie2"><span class="pr2">Bs. ${p.precio}</span><button onclick="tab='${p.categoriaId}';dibujar();$('grid').scrollIntoView({behavior:'smooth'})">Ver en el menú</button></div></div>
   </article>`).join('') + '</div>' : '';
  const lista = platos.filter(p => p.categoriaId === tab);
  $('grid').innerHTML = lista.length ? lista.map(p => `
   <article class="card ${p.disponible ? '' : 'agotado'}">
    <div class="foto ${p.imagen ? '' : 'vacia'}">${p.imagen ? `<img src="${esc(p.imagen)}" alt="" onerror="this.parentNode.classList.add('vacia');this.replaceWith('🍽')">` : '🍽'}</div>
    <div class="cuerpo"><h3>${esc(p.nombre)}</h3><p>${esc(p.descripcion)}</p>
     <div class="fila"><span class="precio">Bs. ${p.precio}</span>${p.disponible ? '' : '<span class="badge">Agotado</span>'}</div>
    </div></article>`).join('') : '<p>No hay platos en esta categoría.</p>';
}
cargar();
</script></body></html>
