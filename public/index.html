<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chef Ejecutivo - Menú</title>
<style>
:root{--crema:#fbf6ef;--beige:#efe2d0;--marron:#4a2c1d;--marron2:#6b4226;--dorado:#c8923a}
[hidden]{display:none!important}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--crema);color:var(--marron)}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:14px 24px;background:#fff}
.logo{font:italic bold 1.8rem Georgia,serif;line-height:1}.logo small{display:block;font:italic .75rem Georgia,serif;color:#8a5a14;margin-top:4px}
nav{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:0;border-radius:22px;padding:8px 20px;font:600 .95rem "Segoe UI",sans-serif;cursor:pointer;background:var(--beige);color:var(--marron)}
.tab.on{background:var(--marron);color:#fff}.tab.dest{background:#f6e3bd}.tab.dest.on{background:var(--dorado);color:#2b1a10}
.hero{background:linear-gradient(120deg,var(--beige),#f6ebdc);padding:40px 24px;border-bottom:1px solid var(--beige)}
.hero h1{margin:0;font:bold 2.4rem Georgia,serif}.hero p{margin:6px 0 0;font-size:1.1rem}.hero hr{width:60px;border:0;border-top:3px solid var(--dorado);margin:14px 0 0;text-align:left}
main{max-width:1100px;margin:auto;padding:24px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(74,44,29,.12);overflow:hidden;display:flex;flex-direction:column}
.foto{background:var(--beige);display:flex;align-items:center;justify-content:center;font-size:2.6rem}.foto.vacia{height:150px}
.foto img{display:block;width:100%;height:auto}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}.cb h3{margin:0;font-size:1.05rem}
.fila{display:flex;justify-content:space-between;align-items:center}.precio{font-weight:700;font-size:1.15rem}
.badge{background:var(--marron);color:#fff;font-size:.7rem;border-radius:10px;padding:3px 8px}
.ver{margin-top:auto;align-self:flex-start;background:var(--marron);color:#fff;border:0;border-radius:16px;padding:6px 14px;font:600 .8rem "Segoe UI",sans-serif;cursor:pointer}
.agotado .foto,.agotado h3{opacity:.55}
.dest{display:flex;flex-direction:column;gap:18px}
.banner{background:var(--marron);color:#fff;border-radius:24px;display:flex;align-items:center;gap:28px;padding:24px 28px}
.banner .img{width:260px;flex-shrink:0;border-radius:16px;overflow:hidden;background:var(--beige);display:flex;align-items:center;justify-content:center;font-size:3rem}
.banner .img.vacia{height:140px}.banner .img img{display:block;width:100%;height:auto}.banner .txt{flex:1}
.etq{color:#e8c98f;font-weight:700;letter-spacing:2px;font-size:.8rem}.banner h2{margin:6px 0;font:bold 1.9rem Georgia,serif}
.banner p{margin:0 0 14px;color:#f0e4d2;line-height:1.5}.pie2{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.pr2{font:bold 1.6rem Georgia,serif}
.banner button{background:var(--dorado);color:#2b1a10;border:0;border-radius:20px;padding:9px 18px;font-weight:600;cursor:pointer}
.velo{position:fixed;inset:0;background:rgba(43,26,16,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.ficha{background:#fff;border-radius:20px;max-width:520px;width:100%;max-height:92vh;overflow:auto;position:relative}
.ficha .foto{border-radius:20px 20px 0 0;overflow:hidden}.ficha .foto.vacia{height:180px}
.cerrar{position:absolute;top:10px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:#fff;font-size:1.4rem;cursor:pointer;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.mc{padding:18px 20px 22px;display:flex;flex-direction:column;gap:10px}
.mc h2{margin:0;font:bold 1.6rem Georgia,serif}.mc h3{margin:6px 0 0;font:bold 1.05rem Georgia,serif}.mc p{margin:0;line-height:1.5;color:#5e4a3d}
.etq2{color:#8a5a14;font-weight:700;letter-spacing:1.5px;font-size:.75rem;text-transform:uppercase}
.ops{display:flex;flex-direction:column;gap:6px}.ops label{display:flex;gap:8px;align-items:center}
textarea,#mesa{padding:10px;font:inherit;border:1px solid #d9c7b0;border-radius:8px;background:var(--crema);color:var(--marron)}
.resumen{background:var(--beige);border-radius:10px;padding:10px 12px;font-size:.9rem}
.copiar:disabled{opacity:.5;cursor:default}#msg{font-weight:600;min-height:1.2em}
.copiar{background:var(--marron);color:#fff;border:0;border-radius:20px;padding:10px 18px;font-weight:600;cursor:pointer;align-self:flex-start}
footer{background:var(--marron);color:#f6ebdc;text-align:center;padding:18px;font:italic 1.2rem Georgia,serif;margin-top:32px}
@media(max-width:640px){.grid{grid-template-columns:1fr}.card{flex-direction:row}.foto{width:120px;flex-shrink:0;align-self:flex-start}.foto.vacia{height:120px}
.ficha .foto{width:100%;align-self:auto}.hero h1{font-size:1.8rem}.banner{flex-direction:column;align-items:stretch}.banner .img{width:100%}}
</style></head><body>
<header>
 <div class="logo">Chef Ejecutivo<small>Comida que se disfruta</small></div>
 <nav id="tabs"></nav>
</header>
<section class="hero"><h1>Nuestro Menú</h1><p>Sabores únicos en cada plato</p><hr></section>
<main><div class="dest" id="destacados"></div><div class="grid" id="grid"></div></main>
<footer>¡Buen provecho!</footer>
<div class="velo" id="modal" hidden onclick="if(event.target===this)cerrar()"><div class="ficha" id="ficha" role="dialog" aria-modal="true" aria-labelledby="mTitulo"></div></div>
<script>
// Página del CLIENTE: solo lee el menú. No tiene formularios ni botones de edición.
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DEST = 'destacados';           // "pestaña" especial de platos destacados
let cats = [], platos = [], tab = null;

// Foto completa; si no hay foto o el enlace falla, muestra un ícono
const foto = (p, clase) => `<div class="${clase} ${p.imagen ? '' : 'vacia'}">${p.imagen
  ? `<img src="${esc(p.imagen)}" alt="" onerror="this.parentNode.classList.add('vacia');this.replaceWith('🍽')">` : '🍽'}</div>`;

async function cargar() {
  try {
    const [c, p] = await Promise.all([fetch('/api/categorias'), fetch('/api/platos')]);
    cats = await c.json(); platos = await p.json();
    if (!tab && cats.length) tab = cats[0]._id;
    dibujar();
  } catch (e) { $('grid').innerHTML = '<p>No se pudo cargar el menú. Intenta de nuevo en unos segundos.</p>'; }
}

function dibujar() {
  const dest = platos.filter(p => p.destacado && p.disponible).slice(0, 3);   // el administrador marca hasta 3
  if (tab === DEST && !dest.length) tab = cats[0]._id;
  $('tabs').innerHTML = cats.map(c => `<button class="tab ${c._id === tab ? 'on' : ''}" onclick="tab='${c._id}';dibujar()">${esc(c.nombre)}</button>`).join('')
    + (dest.length ? `<button class="tab dest ${tab === DEST ? 'on' : ''}" onclick="tab='${DEST}';dibujar()">Platos destacados</button>` : '');

  if (tab === DEST) {                                   // banners de platos destacados
    $('grid').innerHTML = '';
    $('destacados').innerHTML = dest.map(p => `
     <article class="banner">${foto(p, 'img')}
      <div class="txt"><div class="etq">PLATO DESTACADO</div><h2>${esc(p.nombre)}</h2><p>${esc(p.descripcion)}</p>
       <div class="pie2"><span class="pr2">Bs. ${p.precio}</span><button onclick="abrir('${p._id}')">Ver plato</button></div></div>
     </article>`).join('');
    return;
  }
  $('destacados').innerHTML = '';
  const lista = platos.filter(p => p.categoriaId === tab);   // tarjetas: foto, nombre, precio y "Ver plato"
  $('grid').innerHTML = lista.length ? lista.map(p => `
   <article class="card ${p.disponible ? '' : 'agotado'}">${foto(p, 'foto')}
    <div class="cb"><h3>${esc(p.nombre)}</h3>
     <div class="fila"><span class="precio">Bs. ${p.precio}</span>${p.disponible ? '' : '<span class="badge">Agotado</span>'}</div>
     <button class="ver" onclick="abrir('${p._id}')">Ver plato</button></div>
   </article>`).join('') : '<p>No hay platos en esta categoría.</p>';
}

// Opciones sugeridas si el plato no tiene las suyas (campo "opciones" en Atlas)
const opcionesBase = cat => cat === 'Bebidas' ? ['Sin hielo', 'Poco azúcar'] : cat === 'Postres' ? ['Poco azúcar', 'Sin crema']
  : ['Sin cebolla', 'Sin tomate', 'Sin picante', 'Carne bien cocida', 'Carne término medio', 'Carne semi cruda'];

// Ficha del plato: descripción, especificaciones y envío del pedido (se guarda en Atlas)
function abrir(id) {
  const p = platos.find(x => x._id === id); if (!p) return;
  const cat = (cats.find(c => c._id === p.categoriaId) || {}).nombre || '';
  const ops = (p.opciones && p.opciones.length) ? p.opciones : opcionesBase(cat);
  $('ficha').innerHTML = `<button class="cerrar" onclick="cerrar()" aria-label="Cerrar">×</button>${foto(p, 'foto')}
   <div class="mc"><div class="etq2">${esc(cat)}</div><h2 id="mTitulo">${esc(p.nombre)}</h2>
    <div class="precio">Bs. ${p.precio}${p.disponible ? '' : ' · Agotado'}</div>
    <p>${esc(p.descripcion) || 'Sin descripción.'}</p>
    <h3>Especificaciones</h3>
    ${ops.length ? `<div class="ops">${ops.map(o => `<label><input type="checkbox" value="${esc(o)}" onchange="resumen('${p._id}')"> ${esc(o)}</label>`).join('')}</div>` : ''}
    <textarea id="nota" rows="2" maxlength="200" placeholder="Otra indicación (ej.: sin cebolla, carne bien cocida)" oninput="resumen('${p._id}')"></textarea>
    <input id="mesa" maxlength="40" placeholder="Tu mesa o nombre (ej.: Mesa 5)" ${p.disponible ? '' : 'disabled'}>
    <div class="resumen" id="resumen" hidden></div>
    <button class="copiar" id="btnEnviar" onclick="enviar('${p._id}')" ${p.disponible ? '' : 'disabled'}>Enviar pedido</button>
    <div id="msg" role="status"></div></div>`;
  $('modal').hidden = false; document.body.style.overflow = 'hidden'; $('ficha').scrollTop = 0;
}

function elegidas() { return [...document.querySelectorAll('#ficha .ops input:checked')].map(i => i.value); }

function resumen(id) {
  const p = platos.find(x => x._id === id);
  const partes = [...elegidas(), ...($('nota').value.trim() ? [$('nota').value.trim()] : [])];
  $('resumen').hidden = !partes.length;
  $('resumen').textContent = partes.length ? 'Tu pedido: ' + p.nombre + ' — ' + partes.join(', ') : '';
}

async function enviar(id) {
  const mesa = $('mesa').value.trim();
  if (!mesa) { $('msg').textContent = 'Escribe tu mesa o nombre.'; return; }
  try {
    const r = await fetch('/api/pedidos', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ platoId: id, mesa, especificaciones: elegidas(), nota: $('nota').value.trim() }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Error');
    $('msg').textContent = 'Pedido enviado. ¡Gracias!'; $('btnEnviar').disabled = true;
  } catch (e) { $('msg').textContent = 'No se pudo enviar: ' + e.message; }
}

function cerrar() { $('modal').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrar(); });
cargar();
</script></body></html>
